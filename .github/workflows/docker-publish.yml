name: Build and publish Docker image

on:
  push:
    branches: [claude/product-price-comparison-08kxgr]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The category/leg-style/gender-vs-colour regression suite (layer 4
      # of the anti-misclassification plan): every case here is a real,
      # live-verified bug found and fixed during development. A failure
      # here means this push would have reintroduced one of them, so the
      # image is never built or published.
      - run: npm ci
      - run: npm run test:regression --workspace backend

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/annaleo94/markets:latest
            ghcr.io/annaleo94/markets:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
